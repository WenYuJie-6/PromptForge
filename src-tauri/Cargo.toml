[package]
name = "promptforge"
version = "0.2.0"
description = "PromptForge 提示词工坊"
authors = ["PromptForge"]
license = "ISC"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tiny_http = "0.12"
base64 = "0.22"
# 更新检测与下载。关掉默认特性（http2 / charset 用不上），
# 只开 default-tls：Windows 下走 schannel，纯 Rust 绑定，无需 C 工具链。
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls"] }
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
