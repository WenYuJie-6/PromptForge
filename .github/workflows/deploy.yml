name: Deploy to GitHub Pages

# 构建并发布到 GitHub Pages。
#
# 关键点（与「桌面端自动更新」直接相关）：
#   1. sync:dist 必须跑在 tauri-build 之前。
#      tauri-build.mjs 的第一步是 `cargo build --release`，而 tauri.conf.json 的
#      frontendDist 指向 ../dist-app —— 该目录被 .gitignore 排除，全新 checkout 时不存在，
#      cargo 会在编译期 panic（lib.rs 的 tauri::context! 宏读不到前端资源）。
#      实测：移走 dist-app/ 后 cargo check 直接 exit 101。
#   2. 必须先构建 Tauri（产出真实 .exe），否则 Pages 上只有前端、没有安装包。
#   3. 构建前把 Pages 地址写进根 version.json 的 updateUrl，这样打进安装包的
#      dist-app/version.json 也会带上更新源，已装客户端才能从 Pages 拉到新版本。
#   4. 启动器 .ps1/.bat 强制 UTF-8 BOM + CRLF，避免 Windows PowerShell 5.1 按 GBK 解码报错。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # PS5.1 编码陷阱：确保启动器带 BOM + CRLF（checkout 可能把换行归一化掉）
      - name: Ensure launcher scripts are UTF-8 BOM + CRLF
        run: node scripts/fix-ps-encoding.mjs assets-templates/启动.ps1 assets-templates/启动.bat

      # 把 Pages 地址注入根 version.json（发布时随清单下发给所有客户端）。
      # 用 GITHUB_REPOSITORY（形如 owner/repo）而非 github.event.repository.name：
      # 后者在 workflow_dispatch 触发时可能为空，会静默写成 https://user.github.io// 这种畸形地址。
      # 仓库名保持原样（不转小写）：GitHub Pages 的 /<repo>/ 路径按仓库名原样解析。
      - name: Inject GitHub Pages update URL
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          url="https://${{ github.repository_owner }}.github.io/${repo}/"
          node scripts/inject-pages-url.mjs "$url"
          echo "updateUrl -> $url"

      - name: Install npm deps (@tauri-apps/cli)
        run: npm install

      # 生成 dist-app/ 与 dist/ —— cargo build 的编译期前置条件（见文件头第 1 条）。
      # 此时 release/version.json 尚不存在，write-version 会降级为「无 windows 字段」，
      # 随后 build-release 产出真正的清单，末尾再跑一次 sync:dist 把它们桥接进 dist/。
      - name: Prepare frontend (dist-app + dist)
        run: npm run sync:dist

      # Rust 单元测试：覆盖更新判定的双轴真值表（app 相同 + 前端 webVersion 领先 → Web 等）。
      # 必须放在 sync:dist 之后 —— 编译 lib 时 tauri::generate_context! 需要 dist-app/。
      # 这是"更新链路由真值表守护"的关键：JS 镜像与 token 断言都可能漏检，单测不能漏。
      - name: Rust unit tests (update decision)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri app (cargo + NSIS/MSI bundle)
        run: node scripts/tauri-build.mjs

      - name: Build release package (version.json + installer + web-update)
        run: node scripts/build-release.mjs

      # 最终 dist/version.json：此时 release/version.json 已存在，write-version 能桥接 windows 字段。
      # 同时把带 windows 的清单回填给 dist-app/version.json（见 sync-dist.mjs 的桥接逻辑），
      # 保证装好的客户端从自己安装目录就能拿到完整清单，不依赖联网。
      - name: Sync dist (final dist/version.json with windows + updateUrl)
        run: npm run sync:dist

      - name: Verify update chain
        run: node scripts/verify-update-chain.mjs

      # 全部 .workbuddy 套件（约 680+ 断言）的总闸。必须放在 Build release package 与
      # Sync dist 之后：其内的 verify-update-chain 依赖 release/ 产物，放太早会在 CI 上假红。
      # 保留上面的 Verify update chain 步骤（它被既有断言钉着），此处并存（少量重复，换零回归）。
      - name: Run all guard suites (run-all-checks)
        run: node .workbuddy/run-all-checks.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
